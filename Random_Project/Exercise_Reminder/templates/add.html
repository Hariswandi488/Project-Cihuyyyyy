<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Tasks</title>
    <link rel="stylesheet" href="../static/css/global.css">
    <link rel="stylesheet" href="../static/css/add.css">
</head>
<body>
    <header>
        <div class="ltitle">
            <h1>Task Reminder</h1>
        </div>

        <nav class="navhead">
            <a href="/">Home</a>
            <a href="/menu">Menu</a>
            <a href="/list">List</a>
        </nav>
    </header>

    <div class="container_add">
        <form class="addform" action="/add" method="post" id="addform">
            <h3>Tambahkan Tugas</h3>

            <label for="task_name">Nama Tugas</label>
            <input type="text" name="task_name" id="task_name" required>

            <label for="deadline">Tanggal Dikumpulkan</label>
            <input type="date" name="deadline" id="deadline" required>

            <label for="">Mapel</label>
            <select name="subject" required>
                <option value="mtk_wajib">MTK Wajib</option>
                <option value="mtk_lanjut">MTK Lanjut</option>
                <option value="ekonomi">Ekonomi</option>
                <option value="pai">PAI</option>
                <option value="b_indo">B. Indonesia</option>
                <option value="b_inggris">B. Inggris</option>
                <option value="pkn">PKN</option>
                <option value="pkwu">PKWU</option>
                <option value="fisika">Fisika</option>
                <option value= "tik">TIK</option>
            </select>

            <button type="submit" id="addsubmit">Tambahkan</button>
        </form>
    </div>

    <script src="../static/js/loader.js"></script>
    <script src="../static/js/add.js"></script>
</body>
</html>
